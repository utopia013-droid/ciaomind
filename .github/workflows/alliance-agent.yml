name: Alliance agent checks
on:
  pull_request:
    paths:
      - apps/alliance-agent/**
      - .github/workflows/alliance-agent.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/alliance-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/alliance-agent/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run demo:mission
